@startuml
!pragma layout elk
hide methods
enum AgentResponsesOutputType {
    CART
    QUOTE_REQUEST
}
interface AgentResponsesPayload [[AgentResponsesPayload.svg]]  {
    outputType: [[AgentResponsesOutputType.svg AgentResponsesOutputType]]
    locale: String
    prompt: String
    businessUnit: [[BusinessUnitResourceIdentifier.svg BusinessUnitResourceIdentifier]]
    store: [[StoreResourceIdentifier.svg StoreResourceIdentifier]]
}
interface AgentResponsesRequest [[AgentResponsesRequest.svg]]  {
    outputType: [[AgentResponsesOutputType.svg AgentResponsesOutputType]]
    locale: String
    prompt: String
    businessUnit: [[BusinessUnitResourceIdentifier.svg BusinessUnitResourceIdentifier]]
    store: [[StoreResourceIdentifier.svg StoreResourceIdentifier]]
}
interface AgentResponsesSuccess [[AgentResponsesSuccess.svg]]  {
    entityType: [[AgentResponsesOutputType.svg AgentResponsesOutputType]]
    warnings: [[WarningObject.svg List<WarningObject>]]
    threadId: String
}
AgentResponsesOutputType - -> AgentResponsesPayload #green;text:green : "outputType"
AgentResponsesOutputType - -> AgentResponsesRequest #green;text:green : "outputType"
AgentResponsesOutputType - -> AgentResponsesSuccess #green;text:green : "entityType"
@enduml

