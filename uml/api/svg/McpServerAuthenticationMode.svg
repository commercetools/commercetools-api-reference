@startuml
!pragma layout elk
hide methods
enum McpServerAuthenticationMode {
    CLIENT_CREDENTIALS
    COMMERCETOOLS_IDENTITY
}
interface McpServer [[McpServer.svg]]  {
    id: String
    version: Long
    createdAt: DateTime
    lastModifiedAt: DateTime
    lastModifiedBy: [[LastModifiedBy.svg LastModifiedBy]]
    createdBy: [[CreatedBy.svg CreatedBy]]
    key: String
    name: [[LocalizedString.svg LocalizedString]]
    description: [[LocalizedString.svg LocalizedString]]
    authenticationMode: [[McpServerAuthenticationMode.svg McpServerAuthenticationMode]]
    state: [[McpServerState.svg McpServerState]]
    mcpServer: [[McpServerConfig.svg McpServerConfig]]
}
interface McpServerDraft [[McpServerDraft.svg]]  {
    key: String
    name: [[LocalizedString.svg LocalizedString]]
    description: [[LocalizedString.svg LocalizedString]]
    authenticationMode: [[McpServerAuthenticationMode.svg McpServerAuthenticationMode]]
    state: [[McpServerState.svg McpServerState]]
    mcpServer: [[McpServerConfigDraft.svg McpServerConfigDraft]]
}
interface McpServerSetAuthenticationModeAction [[McpServerSetAuthenticationModeAction.svg]]  {
    action: String
    authenticationMode: [[McpServerAuthenticationMode.svg McpServerAuthenticationMode]]
}
McpServerAuthenticationMode - -> McpServer #green;text:green : "authenticationMode"
McpServerAuthenticationMode - -> McpServerDraft #green;text:green : "authenticationMode"
McpServerAuthenticationMode - -> McpServerSetAuthenticationModeAction #green;text:green : "authenticationMode"
@enduml

