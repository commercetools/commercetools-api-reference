@startuml
!pragma layout elk
hide empty fields
hide empty methods
legend
|= |= line |
|<back:black>   </back>| inheritance |
|<back:green>   </back>| property reference |
|<back:blue>   </back>| discriminated class |
endlegend
interface SubRate [[SubRate.svg]]  {
    name: String
    amount: Double
}



interface ExternalTaxRateDraft [[ExternalTaxRateDraft.svg]]  {
    name: String
    amount: Double
    includedInPrice: Boolean
    country: String
    state: String
    subRates: [[SubRate.svg List<SubRate>]]
    taxRoundingTarget: [[TaxRoundingTarget.svg TaxRoundingTarget]]
}
interface TaxRate [[TaxRate.svg]]  {
    id: String
    key: String
    name: String
    amount: Double
    includedInPrice: Boolean
    country: String
    state: String
    subRates: [[SubRate.svg List<SubRate>]]
    taxRoundingTarget: [[TaxRoundingTarget.svg TaxRoundingTarget]]
}
interface TaxRateDraft [[TaxRateDraft.svg]]  {
    name: String
    amount: Double
    includedInPrice: Boolean
    country: String
    state: String
    subRates: [[SubRate.svg List<SubRate>]]
    key: String
    taxRoundingTarget: [[TaxRoundingTarget.svg TaxRoundingTarget]]
}

SubRate - -> ExternalTaxRateDraft #green;text:green : "subRates"
SubRate - -> TaxRate #green;text:green : "subRates"
SubRate - -> TaxRateDraft #green;text:green : "subRates"
@enduml

